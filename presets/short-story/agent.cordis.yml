# 短篇小说模式 —— 一个"写作专用"的 agent preset。
#
# 这个文件属于 `dsh-story-mode` 包，路径是包内的 `presets/short-story/agent.cordis.yml`。
# 它**住在包里**：包的 `cordis.patch.yml` 在运行时用 `createRequire(ctx.baseUrl)`
# 问出本包装在哪，并把 `presets/` 目录声明为 roster 的一个根。
#
# 所以没有"复制到 `.dsh`"这一步，也没有需要手动跑的清理：卸载包，模式自动消失。
#
# 注意根目录**本身**必须是真实目录，因为 `scanRoot` 用
# `readdir().isDirectory()` 判定根下的每个 `<id>` 条目、**不跟随符号链接**——
# 链接形式的预设会被静默跳过。放在包内天然满足这一条。
#
# 与 `standard` 的差别不是"少几个工具"，而是换了交付物：这里没有编译器，
# 唯一的裁判是人。所以本文件做三件事：
#   1. 换掉人设：从编码 agent 变成接稿的短篇小说作者（persona 行）。
#   2. 拆掉验证环：shell / 计划模式 / 后台任务 / 工作流 / 多级委派全部去掉。
#      写小说不需要"跑一下看看"，留着只会把会话拖回工程节奏。
#   3. 补上写作环：包内自带的 short-story 技能 + 面向长正文的精确编辑工具
#      + 搜索（glob / grep，见下面 tool-fs-search 那段：它不在"拆掉"那一类里，
#      因为跨篇核对名字与细节是写作本身的一部分）。
#
# 交付物是磁盘上的稿件，不是聊天里的回复——这条约定写在 persona 里，
# 也写在技能里，因为它是这个模式全部价值的前提。
#
# ── 规则住在哪里（改这里之前先读）────────────────────────────────────────────
#
#   persona 行          身份、交付物、工作区边界、文风优先级。**不放流程规则**：
#                       这段文本每一轮常驻，而且每个子代理都会连它一起收到。
#   short-story 技能    流程入口与范围分流（接稿、规划、审读、交付）。
#   writing-workflow.md 完整工序：接稿确认、人物卡、节拍、成稿、修订、交付。
#   review-panel.md     审读规则：派发、版本、复用、角色触发条件、汇总验收。
#   reviewers/*.md      五个审读角色的**固定 persona**，由下面每一行的
#                       `persona` 从文件读出（`!!js`），派发时不再重述。
#
# 所以"派审读员"这件事有三层，只有第一层需要模型做判断：
#   1. 主代理读面板的**角色触发条件表**，决定派哪几个；
#   2. 用对应的角色工具派发，prompt 里只给变量（路径、版本、范围、改动清单）；
#   3. 角色自己的 persona 已经在孩子身上，信息边界不靠主代理复述。
#
# 判据不是"工具多了几个"，而是"哪一层缺了会静默失效"：persona 里写过流程规则，
# 就会和技能文档各说一套；模板写在面板里，就会每次派发重述一遍、也就每次可能漏掉
# 一条信息边界。v1.1.3 之前正是这个形态。

# ── 身份 ────────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: 你的工作目录是 {{cwd}}。
    prefix: |-
      你是一位短篇小说作者，擅长细腻的情感描写、人物的内心世界与微妙的人际关系。你由 {{model}} 驱动，运行在 DeepSeek Harness 上。

      进入这个模式意味着你不再是编码 agent：这里没有构建、测试或类型检查，唯一的读者是人。所以你的交付物是**磁盘上的稿件文件**，不是聊天里的回复。正文一律先落盘，再用一两句话向作者汇报你做了什么、以及哪里你拿不准。

      **这是写作工作区，不是你的个人项目。** 只读、只改写作者让你改的文件。不要顺手创建 README、说明文档、目录索引、总结文件或任何作者没要的文件；不要重命名、移动或删除既有文件。需要新增文件时，先说明为什么需要。

      写任何正文或改稿之前，先加载 `short-story` 技能，再用文件读取工具完整读取它的 `references/writing-workflow.md` 与 `references/review-panel.md`——完整故事与片段都要读，加载技能不等于读过参考文件。工序列在共用写作流程里，审读规则和角色触发条件列在面板里，两边都以那里的文本为准，不靠记忆执行。动笔前还要加载 `writing-style-contract`。

      审读角色池有五个，触发条件见面板的角色表：B1 冷读与最终盲读、B2 故事逻辑、B3 阅读体验、B4 文风执行、B5 动作与空间连续性。它们各自有专用工具（名字以 `subagent_review_` 开头），persona 与只读限制已经装在角色身上，**派发时只给变量**：正文路径、版本、范围与停止位置、必要的改动清单。不要传 `run_in_background: false`（前台调用拿不到可复用的 childId）。改稿复核用 `send_message` 发回同一位读者；只有最终盲读换一位全新读者。详情与材料边界见面板。

      **若你是被委派的审读员：只执行派发任务。** 不需要读技能、不必读写作流程；只读派发消息列出的材料，不改文件，不再委派。

      你的文风偏好排在作者之后：作者在接稿时或当场给出的语气、视角、禁忌，优先于技能里的默认风格。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 32768

# ── 文件读写 ────────────────────────────────────────────────────────────────
#
# read / write / edit 套件。注册进宿主 tools 注册表，本身不发布服务，因此
# 不需要 realm；`fs` 服务与其策略留在宿主组成里。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# ── 找文件与找文本 ──────────────────────────────────────────────────────────
#
# glob / grep。写作模式砍掉了 shell，但没有"搜"这件事撑着，改稿会退化成
# 通读：系列连载里"上一章那把伞在第几场出现过""这个名字有没有写错"是很常见
# 的问题，而这些只能靠搜，不能靠读。
#
# 注意 `sampleOverCapGlobResults` 在这条配置里是**必填**（schema 是
# `z.boolean().required()`），漏了它这一行会让整个 preset 挂不上。

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 面向长正文的精确编辑器 ──────────────────────────────────────────────────
#
# `str_replace_editor` 对散文比 `edit` 更合适：view 返回带行号正文，
# str_replace 要求唯一字面量匹配（拒绝 0 处或多处命中，因此不会误改），
# insert 按边界插行。改稿时这是主要工具。

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 24000

# ── 结构与一致性检查（本包自带的持久插件）──────────────────────────────────
#
# 指向**同一个包里**的 `lib/index.js`：story_wordcount / story_lint /
# story_bible / story_doctor。代码提供计数、字段检查与字面定位；
# 专名一致性、人物与视角由审读员结合上下文核对。
#
# 引用写成相对路径 `../../lib/index.js`，这正是为了可移植：
#   * 相对引用以「组合文件所在目录」为基准（`PresetTree.import` 里
#     `classifyRowSpecifier` 判为 `preset` 类型，交给 `super.import` 用本目录
#     解析）。本文件住在 `presets/short-story/` 里，而入口在包根的 `lib/`，所以是 `../../lib/`；
#   * 于是这份文件里**没有任何机器相关的绝对路径**——换一台机器、换一个
#     安装位置、换一个 DSH_HOME，这行都不用改。
#
# 为什么不能用裸包名：裸包名从 harness 解析，而 preset 装在用户目录下，
# Node 的 node_modules 向上查找到不了 harness 自己的依赖。
# 为什么不能用 `!!js` 动态算路径：发现阶段确实支持 `!!js`（用 loader 的 YAML
# 方言解析），但紧随其后的形状检查要求每行 `name` 是字符串，`!!js` 解析出来
# 是对象，整份组成会被判为 broken。
#
# 这行能工作还有一个前提：**插件零运行时依赖**。ESM 的解析基准是加载入口的
# 父路径，所以插件若 import 任何 `@deepseek-ai/*` 包，就必须自带 node_modules；
# 而它什么都不 import（连 schemastery 都没有），于是任何布局下都能加载。
# 这是刻意的设计，改动时不要引入裸导入。
#
# 该行解析不到文件时，整个 preset 会变成 broken 行——这是想要的行为：
# 宁可 roster 报错，也不要一个工具悄悄消失的模式。用 story_doctor 可随时自检。
- id: story-tools
  name: '../../lib/index.js'
  config:
    # 传 sceneTargets 时，相对每场目标字数偏离多少百分比才提示。
    sceneDriftPercent: 15
    # 同一个双字词在**一段**叙述里出现几次算过度重复（按段计，不是全文累计——
    # 全文口径会把"自己/什么/一个"这类常用词全报出来）。
    repeatThreshold: 3

# ── 技能 ────────────────────────────────────────────────────────────────────

# 技能注册表在宿主组成里并按 scope 分层：这一行注册进本 preset 的那一层。
# 两个根都以 preset 目录为基准算，所以技能跟着 preset 走，复制或迁移不会脱钩：
#   `skills/`         模式内的写作流程技能（short-story）
#   `../../skills/`   包根的文风契约——与 preset 同属一个包，所以必须一起挂进来
#
# 文风契约**只**从这里挂载：它不该出现在别的模式里。
# `<DSH_HOME>/skills` 是用户根（skill-filesystem 里 rank 400 的 `user-dsh`），
# 而每个 preset 自己挂的 skill-filesystem 实例都会扫它（`includeDefaultRoots`
# 默认 true）——往那儿放一份，等于让文风契约出现在所有模式里，包括编码会话。
# 本包因此不安装任何用户根副本；注册进本 preset 这一层才是正确的作用域。
#
# 为什么必须显式挂 `../../skills/`：persona 与 short-story 技能都要求动笔前读它，
# 缺了这一行，模型第一次 `skill` 调用就会得到
# `skill "writing-style-contract" is unknown or no longer available`，再花一整轮
# 去翻文件系统找一个根本不存在的路径。`story_doctor` 会检查这一行在不在。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../../skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 上下文压缩 ──────────────────────────────────────────────────────────────
#
# 一部中短篇正文加设定很容易把上下文吃满。`compaction-basic` 读
# `toolResultPrune`（用 ctx.get），所以裁剪器必须与它共享 realm。
# tokenMeter 刻意不放进这个 realm：它属于宿主，浏览器读的上下文计量单位挂在它上面。

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    # 人类侧的 /compact。中短篇写到大半时上下文会满，自动压缩的时机未必是作者
    # 想要的时机——能在场景之间手动压一次，比被迫在半句话里被折掉好。
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 委派：五个角色化的审读员 + 一个通用子代理 ───────────────────────────────
#
# `subagents` 注册表与 spawn 后端在宿主组成里，这里只贡献工具行。
# 写作模式不需要工作流、Ralph 循环或多级委派——那些是编码模式的重武器。
#
# **为什么每个角色一行**：五个审读角色的固定部分（身份、读什么、不读什么、报告
# 格式、字数上限）各自住在一个 `references/reviewers/*.md` 里，由下面每行的
# `persona` 在挂载时读出来装到**那个角色**身上。于是：
#   * 主代理派发时只给变量，不再从面板里抄一遍模板——抄一次就可能漏一条信息边界；
#   * 主代理不必为"派谁"先吃下 18 KB 模板正文；
#   * 每个孩子只装自己那一段，不再连主代理的 5.9 KB 人设一起收到。
#
# **`toolFilter` 是硬限制，不是提示词礼貌用语**：`spawn` provider 在孩子的创建
# 窗口里调用 `childCtx.tools.restrict(...)`（`dsh-subagent/lib/types/child-agent.js`），
# 所以审读员**物理上**没有写文件、编辑、呈现和再委派的能力。v1.1.2 及以前只能在
# 模板里写"只读，不改文件"——审读面板自己都注明"这不是代码层的只读权限隔离"。
# 注意 `restrict()` 对未知工具名**抛错**，而它抛在孩子创建窗口里＝那次派发直接失败，
# 所以 `allow` 只列本组合真实注册过的名字：read / read_image / str_replace_editor /
# glob / grep 来自下面三行工具行，skill 来自 tool-skill 行。
# 故意**不**允许 `skill`：B4 需要的文风契约已经拼进它自己的 persona，其余角色不读技能。
#
# **`persona` 用 `!!js` 从包内文件读**：表达式在挂载时求值，`baseUrl` 是组合文件
# 所在目录，所以路径跟着 preset 走。文件缺失会让这一行 config 无效、整个 preset
# 挂不上——宁可报错，也不要一个悄悄没有信息边界的审读员。`story_doctor` 检查这些文件在不在。
#
# **为什么是 `continuable` 而不是 `one-shot`（v1.1.0 及以前的写法）**：
# 一次性子代理是"派一次、从头读一遍全文、报完就没了"。改稿后想复核，只能再派
# 一位全新的读者，把同一篇正文再从头读一遍——审读轮次越多，越慢，而且每次都是
# 冷前缀。可复用模式调用 `subagents.startContinuable()`，返回一个持久 childId；
# 改稿后的复核用 `send_message` 发回**同一个** childId，它带着上一版的阅读和
# 自己写过的报告继续（前缀命中缓存），不必重读全文，只回答问题即可。
#
# **一个必须知道的坑**：可复用模式下，只有**后台**调用才产生持久 child。
# 源码里前台分支（`run_in_background: false`）走的是 `subagents.start()`
# ——一次性启动，拿不到 childId，也收不了后续消息。所以技能与审读面板都明令
# 派审读员时不要传 `run_in_background: false`：要等报告就等结算通知，不要前台等。
#
# **为什么不开 fork**：fork 继承主代理的全部上下文——大纲、写作推理、作者要求、
# 之前的修改理由。读者一旦看过作者的底牌，报出来的"我没看懂"就不再是读者证据。
# 本模式刻意不挂 `subagent_fork`，也刻意不开 `modelSelectionSettings`：
# 审读员与主代理同路由，判断不会因为换了模型而漂移。
#
# `send_message` / `interrupt_agent` 与 `list_agents` 由 control 包提供，它们是
# 宿主 `subagents` 服务之上的模型侧适配器，不发布服务，所以放在这里不需要 realm。

# 通用出口：留一个没有角色人设、也没有工具限制的子代理，供面板之外的临时用途
# （例如让一位读者在改稿后重读被大改的整场）。常规审读一律走下面的角色工具。
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tool-subagent-review-b1
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent_review_b1
    backgroundMode: continuable
    toolFilter:
      allow: [read, read_image, str_replace_editor, glob, grep]
      deny: [write, edit, present, subagent, send_message, interrupt_agent, list_agents]
    persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/short-story/references/reviewers/b1-cold-read.md', baseUrl)), 'utf8')"

- id: tool-subagent-review-b2
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent_review_b2
    backgroundMode: continuable
    toolFilter:
      allow: [read, read_image, str_replace_editor, glob, grep]
      deny: [write, edit, present, subagent, send_message, interrupt_agent, list_agents]
    persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/short-story/references/reviewers/b2-story-logic.md', baseUrl)), 'utf8')"

- id: tool-subagent-review-b3
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent_review_b3
    backgroundMode: continuable
    toolFilter:
      allow: [read, read_image, str_replace_editor, glob, grep]
      deny: [write, edit, present, subagent, send_message, interrupt_agent, list_agents]
    persona: !!js "process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/short-story/references/reviewers/b3-reading-experience.md', baseUrl)), 'utf8')"

# B4 的 persona = 角色说明 + 文风契约全文。契约必须**拼在角色说明后面**：契约的
# 使用说明要求"先读作者要求、再完整读正文、最后对照契约"，而 persona 在 system
# prompt 里位于最前，正文才是用户消息——顺序天然正确。
#
# **换行符必须写成 `String.fromCharCode(10)`，不能写 `'\n'`。** 这一行的 `!!js` 值
# 是 **YAML 双引号标量**：YAML 会先处理转义，`\n` 在 loader 拿到之前就已经变成真正的
# 换行符，于是 JS 源码里出现跨行的字符串字面量 → `SyntaxError: Invalid or unexpected
# token`。而 `mount` 的契约是"setup 里抛错就回滚整个 agent 创建"，表现为**点新会话
# 没反应**（RPC 失败、没有半成品会话），roster 里 `broken` 仍然是 null——因为文件形状
# 完全合法，只有真正求值那一刻才炸。v1.1.3 正是栽在这里（只有 b4 这一行含转义，
# 另外六个 `!!js` 行不含，所以看起来一切正常）。`scripts/verify-composition.mjs`
# 现在会用 loader 同款解析器交叉验证，这类错误不会再漏过。
- id: tool-subagent-review-b4
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent_review_b4
    backgroundMode: continuable
    toolFilter:
      allow: [read, read_image, str_replace_editor, glob, grep]
      deny: [write, edit, present, subagent, send_message, interrupt_agent, list_agents]
